<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 페이지를 찾을 수 없습니다</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #020617;
        color: #f1f5f9;
      }

      p {
        color: #94a3b8;
      }
    }

    .card {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3.5rem;
      margin: 0 0 0.5rem;
      color: #2563eb;
    }

    p {
      color: #64748b;
      margin: 0.25rem 0;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 0.65rem 1.4rem;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 0.9rem;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>404</h1>
    <p>페이지를 찾을 수 없습니다.</p>
    <p>The page you are looking for does not exist.</p>
    <a href="/">홈으로 돌아가기 · Back to Home</a>
  </div>
</body>

</html>
